<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Novi predmet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B3B8F}a:hover{color:#2F2363}
input::placeholder{color:#8A84A0}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #F1EFF7; font-family: Outfit, sans-serif; color: #1D1A2B; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Predmeti.dc.html" aria-label="Zatvori" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1A2B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="font-size: 16px; font-weight: 600">Novi predmet</span>
<span style="width: 44px"></span>
</div>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Naziv</span>
<input value="Signali i sistemi" style="height: 54px; border: 2px solid #7C6BD6; border-radius: 18px; padding: 0 16px; font-family: Outfit, sans-serif; font-size: 16px; background: #FFFFFF; color: #1D1A2B">
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Boja</span>
<div style="display: flex; gap: 10px" role="radiogroup" aria-label="Boja predmeta">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
<button role="radio" aria-label="{{c.name}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; border-radius: 22px; border: 3px solid {{c.ring}}; background: {{c.hex}}; padding: 0"></button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Kako se polaže?</span>
<div style="display: flex; flex-direction: column; gap: 8px" role="radiogroup">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
<button role="radio" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; border: 2px solid {{p.border}}; background: #FFFFFF; font-family: Outfit, sans-serif; text-align: left; color: #1D1A2B">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{p.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{p.dot}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{p.title}}</span><span style="font-size: 12px; color: #5B5670">{{p.sub}}</span></span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Ispiti</span>
<sc-for list="{{exams}}" as="e" hint-placeholder-count="3">
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{e.name}}</span><span style="font-size: 12px; color: #5B5670">{{e.scope}}</span></div>
<span style="height: 36px; padding: 0 12px; border-radius: 12px; background: #F1EFF7; font-size: 13px; font-weight: 600; display: flex; align-items: center">{{e.date}}</span>
<span style="height: 36px; padding: 0 10px; border-radius: 12px; background: #F1EFF7; font-size: 13px; display: flex; align-items: center">{{e.fmt}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: #5B5670; padding: 0 4px">Obim gradiva po ispitu biraš kad dodaš izvore.</span>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="DodajIzvor.dc.html" style="height: 56px; border-radius: 28px; background: #4B3B8F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Kreiraj i dodaj izvor</a>
<a href="Predmet.dc.html" style="height: 48px; border-radius: 24px; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Izvore dodajem kasnije</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { preset: 'partials', color: 'pink' }; }
  renderVals() {
    const cols = [['pink', '#C026B0', 'Roza'], ['lav', '#7C6BD6', 'Lavanda'], ['blue', '#2563EB', 'Plava'], ['green', '#1F8A70', 'Zelena'], ['orange', '#D97706', 'Narandžasta'], ['slate', '#475569', 'Siva']];
    const ps = [
      { id: 'final', title: 'Samo završni', sub: 'Jedan ispit, cijelo gradivo' },
      { id: 'partials', title: 'Dvije parcijale + integralni', sub: 'Svaka parcijala ima svoj dio gradiva' },
      { id: 'custom', title: 'Prilagođeno', sub: 'Dodaj ispite ručno' }
    ];
    const ex = this.state.preset === 'final'
      ? [{ name: 'Završni', scope: 'Cijelo gradivo', date: '20.01.', fmt: 'Pismeni' }]
      : this.state.preset === 'custom' ? []
      : [
        { name: 'I parcijala', scope: 'Dio gradiva', date: '28.10.', fmt: 'Pismeni' },
        { name: 'II parcijala', scope: 'Dio gradiva', date: '09.12.', fmt: 'Pismeni' },
        { name: 'Integralni', scope: 'Cijelo gradivo', date: '27.01.', fmt: 'Pismeni' }
      ];
    return {
      colors: cols.map(([id, hex, name]) => ({ hex, name, ring: this.state.color === id ? '#1D1A2B' : '#FFFFFF', pick: () => this.setState({ color: id }) })),
      presets: ps.map((p) => {
        const on = this.state.preset === p.id;
        return { ...p, border: on ? '#7C6BD6' : '#FFFFFF', ring: on ? '#4B3B8F' : '#C9C3DE', dot: on ? '#4B3B8F' : 'transparent', pick: () => this.setState({ preset: p.id }) };
      }),
      exams: ex
    };
  }
}
</script>
</body>
</html>
