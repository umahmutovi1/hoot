<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Pregled poglavlja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B3B8F}a:hover{color:#2F2363}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F1EFF7; font-family: Outfit, sans-serif; color: #1D1A2B; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="DodajIzvor.dc.html" aria-label="Nazad" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 16px; font-weight: 600">Pregled poglavlja</span>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #FFFFFF; font-family: Outfit, sans-serif; font-size: 14px; font-weight: 600; color: #4B3B8F">+ Dodaj</button>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; align-items: center; gap: 14px">
<div style="width: 48px; height: 48px; border-radius: 16px; background: #E9E4FB; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B3B8F" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{count}} jedinica · 417 str.</span><span style="font-size: 12px; color: #5B5670">Procjena ~26h · težinu je dao AI, možeš je mijenjati</span></div>
</div>

<div style="background: #FDEBD3; border-radius: 20px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A4B0B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17h.01"></path></svg>
<span style="font-size: 13px; line-height: 1.4; color: #5C3208"><b>1 upozorenje:</b> krajnja stranica za 3.2 nije čitljiva. Uzeta je početna stranica sljedećeg poglavlja − 1.</span>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{units}}" as="u" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px; padding-left: {{u.indent}}; border-radius: 16px; background: {{u.bg}}">
<span style="width: 28px; font-size: 13px; font-weight: 600; color: #5B5670">{{u.label}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 14px; font-weight: {{u.fw}}">{{u.title}}</span><span style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: #6E6985">{{u.pages}}<span style="display: flex; gap: 2px"><sc-for list="{{u.dots}}" as="d" hint-placeholder-count="5"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{d}}"></span></sc-for></span></span></span>
<button onClick="{{u.remove}}" aria-label="Ukloni {{u.label}}" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A84A0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>

<a href="ObimIspita.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #4B3B8F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Sačuvaj i podijeli po ispitima</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { gone: [] }; }
  renderVals() {
    const all = [
      ['1', 'Signali i sistemi — uvod', 'str. 1–56', 2, 0, false],
      ['2', 'LTI sistemi', 'str. 74–138', 3, 0, false],
      ['2.1', 'Konvolucijska suma', 'str. 75–90', 3, 1, false],
      ['2.2', 'Konvolucijski integral', 'str. 90–102', 4, 1, false],
      ['3', 'Fourierov red', 'str. 177–250', 4, 0, false],
      ['3.1', 'Odziv LTI na eksponencijale', 'str. 182–186', 3, 1, false],
      ['3.2', 'Svojstva Fourierovog reda', 'str. 202–? → 220', 4, 1, true],
      ['4', 'Fourierova transformacija', 'str. 284–355', 4, 0, false],
      ['5', 'DTFT', 'str. 358–417', 4, 0, false],
      ['6', 'Amplitudna i fazna karakteristika', 'str. 423–500', 3, 0, false]
    ];
    const live = all.filter((u) => !this.state.gone.includes(u[0]));
    return {
      count: live.length,
      units: live.map(([label, title, pages, d, child, warn]) => ({
        label, title, pages,
        indent: child ? '28px' : '8px', fw: child ? 400 : 600,
        bg: warn ? '#FDF3E4' : 'transparent',
        dots: [1, 2, 3, 4, 5].map((n) => (n <= d ? '#C026B0' : '#EEEBF5')),
        remove: () => this.setState({ gone: [...this.state.gone, label] })
      }))
    };
  }
}
</script>
</body>
</html>
