<div style="display: flex; gap: 24px; align-items: flex-start">

<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.2-4.8 3.2-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.4V7H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
Nastavi s Googleom</button>

<div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #55516A"><span style="flex: 1; height: 1px; background: rgba(58,51,96,.14)"></span>ili emailom<span style="flex: 1; height: 1px; background: rgba(58,51,96,.14)"></span></div>

<label class="lbl"><span>Email</span><input class="in g" type="email" value="uma@primjer.ba"></label>
<label class="lbl"><span>Lozinka</span><input class="in g" type="password" placeholder="Ako si je postavila/postavio"></label>
<button class="btn" style="background: #14121C; color: #fff">Prijavi se</button>
<button class="btn" style="background: transparent; color: #4C4892; height: 44px">Pošalji mi kod na email</button>
<span style="font-size: 12px; color: #3F3B4E; text-align: center">Bez lozinke ili si je zaboravio/la? Kod iz emaila te prijavi.</span>
</div>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(20,18,28,0.28); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; color: #14121C; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: rgba(250,249,253,0.80); backdrop-filter: blur(36px); -webkit-backdrop-filter: blur(36px); border-radius: 32px 32px 0 0; padding: 12px 24px 36px; display: flex; flex-direction: column; gap: 14px">

<button class="btn" style="background: linear-gradient(160deg, #6E67BE, #4C4892); color: #fff">Spasi lozinku</button>
<button class="btn" style="background: transparent; color: #4C4892; height: 44px">Preskoči</button>
