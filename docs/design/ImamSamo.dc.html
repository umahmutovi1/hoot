<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 30 }; }
  renderVals() {
    const segOf = (cur, items, set) => items.map(([id, label]) => { const on = cur === id; return { label, bg: on ? 'rgba(255,255,255,0.85)' : 'transparent', fg: on ? '#14121C' : '#3F3B4E', sh: on ? '0 2px 8px rgba(58,51,96,0.10)' : 'none', pick: () => set(id) }; });
    const chipOf = (on) => ({ bg: on ? '#14121C' : 'rgba(255,255,255,0.50)', fg: on ? '#FFFFFF' : '#14121C' });
    const m = this.state.m;
    const P = { 15: ['Vjerovatnoća · 6 kartica', 'Ponavljanje dospjelo danas · 15 min'], 30: ['Signali · test pogl. 3', 'Jačina 52%, I parcijala za 7 dana'], 45: ['Baze · 5.1–5.2', 'Prvi dio današnjeg bloka · ~12 str.'], 60: ['Baze · 5.1–5.3', 'Cijeli sljedeći blok'] };
    return { mins: [15, 30, 45, 60].map((v) => ({ label: v + ' min', ...chipOf(m === v), pick: () => this.setState({ m: v }) })), pickTitle: P[m][0], pickWhy: P[m][1], startLabel: 'Počni · ' + m + ' min' };
  }
}
</script>
