<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Pokreni sesiju</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B3B8F}a:hover{color:#2F2363}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1EFF7; font-family: Outfit, sans-serif; color: #1D1A2B; position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 48px; width: 200px; border-radius: 24px; background: #FFFFFF"></div>
<div style="height: 80px; width: 220px; border-radius: 16px; background: #E3DFEF; margin-top: 12px"></div>
<div style="height: 70px; border-radius: 24px; background: #FFFFFF"></div>
<div style="height: 170px; border-radius: 28px; background: #4B3B8F"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(29,26,43,0.45)"></div>

<div role="dialog" aria-label="Pokreni sesiju" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 5px; border-radius: 3px; background: #DCD7EA; align-self: center"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Šta učiš sad?</h1>
<p style="margin: 0; font-size: 14px; color: #5B5670">Predložen je sljedeći blok iz današnjeg plana.</p>
</div>

<div role="radiogroup" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button role="radio" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; border: 2px solid {{o.border}}; background: {{o.bg}}; font-family: Outfit, sans-serif; text-align: left; color: #1D1A2B">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{o.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{o.dot}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{o.title}}</span><span style="font-size: 12px; color: #5B5670">{{o.sub}}</span></span>
<span style="font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: {{o.tagBg}}; color: {{o.tagFg}}">{{o.tag}}</span>
</button>
</sc-for>
</div>

<sc-if value="{{isFree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #1D1A2B; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center">Signali i sistemi</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F1EFF7; font-size: 13px; font-weight: 600; display: flex; align-items: center">Baze podataka</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F1EFF7; font-size: 13px; font-weight: 600; display: flex; align-items: center">Vjerovatnoća</span>
</div>
<span style="font-size: 12px; color: #5B5670">Jedinicu biraš u sesiji („Sad radim na”). Vrijeme se računa u kalibraciju, ali ne skida blok iz plana.</span>
</sc-if>

<a href="Sesija.dc.html" style="height: 56px; border-radius: 28px; background: #4B3B8F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>Počni</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'next' }; }
  renderVals() {
    const list = [
      { id: 'next', title: 'Baze — 5.1–5.3 Normalizacija', sub: 'Sljedeći blok · 60 min · čitanje', tag: 'Preporučeno', tagBg: '#E9E4FB', tagFg: '#3B2D82' },
      { id: 'other', title: 'Vjerovatnoća — 12 pitanja', sub: 'Kasnije danas · 50 min · ponavljanje', tag: 'Plan', tagBg: '#F1EFF7', tagFg: '#5B5670' },
      { id: 'free', title: 'Slobodna sesija', sub: 'Van plana · izaberi predmet', tag: 'Bez plana', tagBg: '#FDEBD3', tagFg: '#5C3208' }
    ];
    return {
      isFree: this.state.pick === 'free',
      opts: list.map((o) => {
        const on = this.state.pick === o.id;
        return { ...o, border: on ? '#7C6BD6' : '#EEEBF5', bg: on ? '#F6F4FB' : '#FFFFFF', ring: on ? '#4B3B8F' : '#C9C3DE', dot: on ? '#4B3B8F' : 'transparent', pick: () => this.setState({ pick: o.id }) };
      })
    };
  }
}
</script>
</body>
</html>
