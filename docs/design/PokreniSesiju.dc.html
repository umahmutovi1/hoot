<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Pokreni sesiju</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C4892}a:hover{color:#36336E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 55% at 0% 0%, rgba(150,141,222,0.62), rgba(150,141,222,0) 62%), radial-gradient(90% 45% at 100% 22%, rgba(229,182,206,0.62), rgba(229,182,206,0) 62%), radial-gradient(110% 50% at 0% 68%, rgba(168,196,234,0.60), rgba(168,196,234,0) 62%), radial-gradient(95% 45% at 100% 100%, rgba(160,148,226,0.55), rgba(160,148,226,0) 62%), linear-gradient(180deg, #ECE9F4 0%, #E8E5F1 100%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; color: #14121C; position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 48px; width: 200px; border-radius: 24px; background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07)"></div>
<div style="height: 80px; width: 220px; border-radius: 16px; background: rgba(106,100,184,0.12); margin-top: 12px"></div>
<div style="height: 70px; border-radius: 24px; background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07)"></div>
<div style="height: 170px; border-radius: 28px; background: #4C4892"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(40,34,80,0.20); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px)"></div>

<div role="dialog" aria-label="Pokreni sesiju" style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(250,249,253,0.80); backdrop-filter: blur(36px) saturate(180%); -webkit-backdrop-filter: blur(36px) saturate(180%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 -10px 40px rgba(40,34,80,0.12); border-radius: 32px 32px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 5px; border-radius: 3px; background: rgba(58,51,96,0.16); align-self: center"></span>
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #7F78CC, #4C4892); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.3), inset 0 1px 1px rgba(255,255,255,0.5), 0 10px 26px rgba(76,72,146,0.22)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 2M10 2.5h4"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Šta učiš sad?</h1>
<p style="margin: 0; font-size: 14px; color: #3F3B4E">Predložen je sljedeći blok iz današnjeg plana.</p>
</div>
</div>

<div role="radiogroup" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button role="radio" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; border: 2px solid {{o.border}}; background: {{o.bg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; text-align: left; color: #14121C">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{o.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{o.dot}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{o.title}}</span><span style="font-size: 12px; color: #3F3B4E">{{o.sub}}</span></span>
<span style="font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: {{o.tagBg}}; color: {{o.tagFg}}">{{o.tag}}</span>
</button>
</sc-for>
</div>

<sc-if value="{{isFree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #14121C; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center">Signali i sistemi</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(106,100,184,0.10); font-size: 13px; font-weight: 600; display: flex; align-items: center">Baze podataka</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(106,100,184,0.10); font-size: 13px; font-weight: 600; display: flex; align-items: center">Vjerovatnoća</span>
</div>
<span style="font-size: 12px; color: #3F3B4E">Jedinicu biraš u sesiji („Sad radim na”). Vrijeme se računa u kalibraciju, ali ne skida blok iz plana.</span>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #3F3B4E">KOLIKO VREMENA IMAŠ?</span>
<div style="display: flex; gap: 6px"><sc-for list="{{mins}}" as="f" hint-placeholder-count="5"><button onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{f.bg}}; color: {{f.fg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; flex: 1; padding: 0 6px">{{f.label}}</button></sc-for></div>
<span style="font-size: 13px; font-weight: 600; color: #3F3B4E; margin-top: 4px">PAUZE</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{presets}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{f.bg}}; color: {{f.fg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; ">{{f.label}}</button></sc-for></div>
<span style="font-size: 12px; color: #55516A">{{hint}}</span>
</div>
<a href="Sesija.dc.html" style="height: 56px; border-radius: 28px; background: linear-gradient(160deg, #6E67BE, #4C4892); color: #FFFFFF; box-shadow: inset 0 1px 1px rgba(255,255,255,0.40), 0 6px 16px rgba(76,72,146,0.22); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>Počni</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'next', min: 0, pr: 'std' }; }
  renderVals() {
    const list = [
      { id: 'next', title: 'Baze — 5.1–5.3 Normalizacija', sub: 'Sljedeći blok · 60 min · čitanje', tag: 'Preporučeno', tagBg: 'rgba(106,100,184,0.16)', tagFg: '#3F3B7E' },
      { id: 'other', title: 'Vjerovatnoća — 12 pitanja', sub: 'Kasnije danas · 50 min · ponavljanje', tag: 'Plan', tagBg: 'rgba(106,100,184,0.10)', tagFg: '#3F3B4E' },
      { id: 'free', title: 'Slobodna sesija', sub: 'Van plana · izaberi predmet', tag: 'Bez plana', tagBg: 'rgba(195,141,82,0.18)', tagFg: '#6B4A2A' }
    ];
    const s = this.state, chipOf = (on) => ({ bg: on ? '#14121C' : 'rgba(255,255,255,0.50)', fg: on ? '#FFFFFF' : '#14121C' });
    const PK = { 15: 'Vjerovatnoća · 6 kartica', 30: 'Signali · test pogl. 3', 45: 'Baze · 5.1–5.2', 60: 'Baze · 5.1–5.3' };
    return {
      mins: [[0, 'Cijeli blok'], [15, '15'], [30, '30'], [45, '45'], [60, '60']].map(([v, label]) => ({ label: v ? label + ' min' : label, ...chipOf(s.min === v), pick: () => this.setState({ min: v }) })),
      presets: [['std', 'Standardno 50/15'], ['pomo', '25/5'], ['flow', 'Flowtime'], ['free', 'Bez pauza']].map(([id, label]) => ({ label, ...chipOf(s.pr === id), pick: () => this.setState({ pr: id }) })),
      hint: s.min ? 'Imam samo ' + s.min + ' min → ' + PK[s.min] + '. Ostatak bloka ide u plan od sutra.' : 'Zadnji korišten predložak je predložen. Default mijenjaš u Postavkama.',
      isFree: this.state.pick === 'free',
      opts: list.map((o) => {
        const on = this.state.pick === o.id;
        return { ...o, border: on ? '#6A64B8' : 'rgba(58,51,96,0.10)', bg: on ? 'rgba(255,255,255,0.40)' : 'rgba(255,255,255,0.55)', ring: on ? '#4C4892' : '#AFAAC4', dot: on ? '#4C4892' : 'transparent', pick: () => this.setState({ pick: o.id }) };
      })
    };
  }
}
</script>
</body>
</html>
