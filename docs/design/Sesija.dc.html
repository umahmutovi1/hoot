<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Aktivna sesija</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B3B8F}a:hover{color:#2F2363}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F1EFF7; font-family: Outfit, sans-serif; color: #1D1A2B; padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Danas.dc.html" aria-label="Nazad" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Baze podataka</span>
<span style="font-size: 12px; color: #5B5670">{{statusLabel}}</span>
</div>
<button aria-label="Režim timera" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A2B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap" role="group" aria-label="Način učenja">
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #4B3B8F; color: #FFFFFF; font-family: Outfit, sans-serif; font-size: 13px; font-weight: 600">Čitanje</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCD7EA; background: #FFFFFF; color: #1D1A2B; font-family: Outfit, sans-serif; font-size: 13px">Zadaci</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCD7EA; background: #FFFFFF; color: #1D1A2B; font-family: Outfit, sans-serif; font-size: 13px">Ponavljanje</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCD7EA; background: #FFFFFF; color: #1D1A2B; font-family: Outfit, sans-serif; font-size: 13px">Pitanja</button>
</div>

<div style="background: #FFFFFF; border-radius: 32px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="position: relative; width: 236px; height: 236px">
<svg width="236" height="236" viewBox="0 0 236 236" aria-hidden="true"><circle cx="118" cy="118" r="104" fill="none" stroke="#EEEBF5" stroke-width="14"></circle><circle cx="118" cy="118" r="104" fill="none" stroke="{{ringColor}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="258 654" transform="rotate(-90 118 118)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span style="font-size: 52px; font-weight: 600; letter-spacing: -1px; line-height: 1">23:41</span>
<span style="font-size: 13px; color: #5B5670">od planiranih 60 min</span>
<span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #E9E4FB; color: #4B3B8F; margin-top: 6px">25/5 · pauza za 1:19</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button onClick="{{toggle}}" style="height: 56px; padding: 0 22px; border-radius: 28px; border: 2px solid #4B3B8F; background: #FFFFFF; color: #4B3B8F; font-family: Outfit, sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px">{{toggleLabel}}</button>
<a href="KrajSesije.dc.html" style="height: 56px; padding: 0 26px; border-radius: 28px; background: #4B3B8F; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>Završi</a>
</div>
<span style="font-size: 12px; color: #5B5670">2 segmenta · 4 min pauze ukupno</span>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Sad radim na</h2>
<span style="font-size: 12px; color: #5B5670">tap za promjenu</span>
</div>
<div style="background: #FFFFFF; border-radius: 24px; padding: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<button onClick="{{u.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; border: none; background: {{u.bg}}; font-family: Outfit, sans-serif; text-align: left; color: #1D1A2B">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{u.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{u.dot}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{u.title}}</span><span style="font-size: 12px; color: #5B5670">{{u.meta}}</span></span>
<span style="font-size: 13px; font-weight: 600; color: #4B3B8F">{{u.min}}</span>
</button>
</sc-for>
</div>
<a href="Jedinica.dc.html" style="height: 52px; border-radius: 26px; background: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B3B8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Bilješka za aktivnu jedinicu</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { paused: false, active: 'a' }; }
  renderVals() {
    const paused = this.state.paused;
    const list = [
      { id: 'a', title: '5.1 Funkcionalne zavisnosti', meta: 'str. 142–151', min: '14 min' },
      { id: 'b', title: '5.2 Normalne forme 1NF–3NF', meta: 'str. 152–161', min: '9 min' },
      { id: 'c', title: '5.3 BCNF', meta: 'str. 162–168', min: '0 min' }
    ];
    return {
      statusLabel: paused ? 'Pauzirano' : 'Sesija u toku',
      ringColor: paused ? '#C9C3DE' : '#7C6BD6',
      toggleLabel: paused ? 'Nastavi' : 'Pauza',
      toggle: () => this.setState({ paused: !paused }),
      units: list.map((u) => {
        const on = u.id === this.state.active;
        return { ...u, bg: on ? '#E9E4FB' : '#FFFFFF', ring: on ? '#4B3B8F' : '#C9C3DE', dot: on ? '#4B3B8F' : 'transparent', pick: () => this.setState({ active: u.id }) };
      })
    };
  }
}
</script>
</body>
</html>
