<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Skala ocjena</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C4892}a:hover{color:#36336E}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 55% at 0% 0%, rgba(150,141,222,0.62), rgba(150,141,222,0) 62%), radial-gradient(90% 45% at 100% 22%, rgba(229,182,206,0.62), rgba(229,182,206,0) 62%), radial-gradient(110% 50% at 0% 68%, rgba(168,196,234,0.60), rgba(168,196,234,0) 62%), radial-gradient(95% 45% at 100% 100%, rgba(160,148,226,0.55), rgba(160,148,226,0) 62%), linear-gradient(180deg, #ECE9F4 0%, #E8E5F1 100%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; color: #14121C; position: relative; overflow: hidden; letter-spacing: -0.2px">
<div style="position: relative; padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 14px; opacity: 0.6"><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><a href="Predmet.dc.html" aria-label="Nazad" style="width: 44px; height: 44px; border-radius: 22px; border: none; flex-shrink: 0; background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14121C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0"><span style="font-size: 16px; font-weight: 600">Bodovi i ocjena</span><span style="font-size: 12px; color: #55516A">Signali i sistemi</span></span><span style="width: 44px"></span></div><div style="background: linear-gradient(160deg, rgba(110,103,190,0.90), rgba(76,72,146,0.94)); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.30), inset 0 1px 1px rgba(255,255,255,0.45), 0 14px 34px rgba(76,72,146,0.24); color: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; "><span style="height: 120px"></span></div></div>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(40,34,80,0.20)"></div><div role="dialog" style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(250,249,253,0.80); backdrop-filter: blur(36px) saturate(180%); -webkit-backdrop-filter: blur(36px) saturate(180%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 -10px 40px rgba(40,34,80,0.12); border-radius: 30px 30px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 14px"><span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(58,51,96,0.20)"></span><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 19px; font-weight: 700">Skala ocjena</span><a href="BodoviOcjena.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: none">Gotovo</a></div>
<div role="tablist" style="display: flex; background: rgba(106,100,184,0.10); border-radius: 22px; padding: 4px"><sc-for list="{{scope}}" as="t" hint-placeholder-count="2"><button role="tab" onClick="{{t.pick}}" style="flex: 1; height: 36px; border-radius: 18px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; box-shadow: {{t.sh}}">{{t.label}}</button></sc-for></div>
<div style="background: rgba(255,255,255,0.6); border-radius: 20px; padding: 2px 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; border-bottom: 1px solid rgba(106,100,184,0.12); background: transparent; text-decoration: none; color: #14121C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; text-align: left; width: 100%"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Ukupno bodova</span></span><span style="font-size: 14px; color: #55516A; text-align: right">100</span></div>
<sc-for list="{{th}}" as="t" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid {{t.line}}"><span style="width: 30px; height: 30px; border-radius: 15px; background: rgba(106,100,184,0.10); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{t.g}}</span><span style="flex: 1; font-size: 15px">od</span>
<span style="display: flex; align-items: center; gap: 6px"><button onClick="{{t.dec}}" aria-label="Manje" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(106,100,184,0.10); color: #4C4892; font-size: 16px">−</button><span style="width: 44px; text-align: center; font-size: 15px; font-weight: 600">{{t.v}}%</span><button onClick="{{t.inc}}" aria-label="Više" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(106,100,184,0.10); color: #4C4892; font-size: 16px">+</button></span></div>
</sc-for></div>
<span style="font-size: 12px; color: #55516A">{{scopeHint}}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { scope: 'all', th: [55, 65, 75, 85, 95] }; }
  renderVals() {
    const segOf = (cur, items, set) => items.map(([id, label]) => { const on = cur === id; return { label, bg: on ? 'rgba(255,255,255,0.85)' : 'transparent', fg: on ? '#14121C' : '#3F3B4E', sh: on ? '0 2px 8px rgba(58,51,96,0.10)' : 'none', pick: () => set(id) }; });
    const chipOf = (on) => ({ bg: on ? '#14121C' : 'rgba(255,255,255,0.50)', fg: on ? '#FFFFFF' : '#14121C' });
    const s = this.state;
    const set = (i, d) => { const th = [...s.th]; const lo = i ? th[i - 1] + 1 : 1, hi = i < 4 ? th[i + 1] - 1 : 100; th[i] = Math.min(hi, Math.max(lo, th[i] + d)); this.setState({ th }); };
    return {
      scope: segOf(s.scope, [['all', 'Za sve predmete'], ['one', 'Samo ovaj predmet']], (id) => this.setState({ scope: id })),
      th: s.th.map((v, i) => ({ g: i + 6, v, line: i === 4 ? 'transparent' : 'rgba(106,100,184,0.12)', dec: () => set(i, -1), inc: () => set(i, 1) })),
      scopeHint: s.scope === 'all' ? 'Mijenja zajedničku skalu za sve predmete. Pragovi moraju rasti.' : 'Samo Signali i sistemi koriste ovu skalu; ostali ostaju na zajedničkoj.'
    };
  }
}
</script>
</body>
</html>
