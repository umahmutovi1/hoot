<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Dokle ste stigli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B3B8F}a:hover{color:#2F2363}
textarea::placeholder{color:#8A84A0}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #F1EFF7; font-family: Outfit, sans-serif; color: #1D1A2B; position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 44px; width: 44px; border-radius: 22px; background: #FFFFFF"></div>
<div style="height: 130px; border-radius: 32px; background: #FBE3F6"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(29,26,43,0.45)"></div>

<div role="dialog" aria-label="Dokle ste stigli" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 5px; border-radius: 3px; background: #DCD7EA; align-self: center"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Dokle ste stigli?</h1>
<p style="margin: 0; font-size: 14px; color: #5B5670">Signali i sistemi · predavanje · danas 09:00–11:00</p>
</div>

<div role="tablist" style="display: flex; background: #F1EFF7; border-radius: 22px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button role="tab" aria-selected="{{t.aria}}" onClick="{{t.pick}}" style="flex: 1; height: 40px; border-radius: 18px; border: none; background: {{t.bg}}; font-family: Outfit, sans-serif; font-size: 14px; font-weight: 600; color: #1D1A2B">{{t.label}}</button>
</sc-for>
</div>

<span style="font-size: 12px; color: #5B5670">Tapni zadnje poglavlje koje je obrađeno.</span>
<div role="radiogroup" aria-label="Obrađeno do" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="10">
<button role="radio" aria-checked="{{i.aria}}" onClick="{{i.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px 6px {{i.indent}}; border: none; border-radius: 14px; background: {{i.bg}}; font-family: Outfit, sans-serif; text-align: left; color: #1D1A2B">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{i.ring}}; background: {{i.dot}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{i.tick}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="width: 30px; font-size: 13px; font-weight: 600; color: #5B5670; flex-shrink: 0">{{i.label}}</span>
<span style="flex: 1; font-size: 14px; font-weight: {{i.fw}}; min-width: 0">{{i.title}}</span>
<sc-if value="{{i.prev}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: #FDEBD3; color: #5C3208; white-space: nowrap">prošli put</span></sc-if>
<sc-if value="{{i.here}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: #4B3B8F; color: #FFFFFF; white-space: nowrap">do ovdje</span></sc-if>
</button>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Bilješka <span style="font-weight: 400; color: #5B5670">(opcionalno)</span></span>
<textarea rows="2" placeholder="npr. profesor preskočio 5.3, rade se zadaci" style="border: none; border-radius: 16px; padding: 12px 14px; font-family: Outfit, sans-serif; font-size: 15px; background: #F6F4FB; color: #1D1A2B; resize: none"></textarea>
</label>

<a href="Predmet.dc.html" style="height: 56px; border-radius: 28px; background: #4B3B8F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{saveLabel}}</a>
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Danas.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Nastava otkazana</a>
<a href="Danas.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none; color: #5B5670">Preskoči</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { src: 'book', upto: { book: '5.2', script: 'L8.2' } }; }
  renderVals() {
    const L = {
      book: { prev: '5', items: [['4', 'Fourierova transformacija', 0], ['4.1', 'Definicija i primjeri', 1], ['4.2', 'Svojstva FT', 1], ['4.3', 'Konvolucija i množenje', 1], ['5', 'DTFT', 0], ['5.1', 'Definicija DTFT', 1], ['5.2', 'Svojstva DTFT', 1], ['5.3', 'Diskretni LTI u frekvenciji', 1], ['6', 'Amplituda i faza', 0], ['6.1', 'Bodeov dijagram', 1]] },
      script: { prev: 'L8', items: [['L7', 'Diskretni signali', 0], ['L7.1', 'Odabiranje i aliasing', 1], ['L8', 'DTFT', 0], ['L8.1', 'Svojstva', 1], ['L8.2', 'Zadaci sa vježbi', 1], ['L9', 'Z-transformacija', 0], ['L9.1', 'Područje konvergencije', 1], ['L10', 'Sistemi u z-domenu', 0]] }
    };
    const s = this.state, cur = L[s.src], up = s.upto[s.src];
    const ui = cur.items.findIndex((x) => x[0] === up);
    return {
      tabs: [['book', 'Oppenheim'], ['script', 'Skripta']].map(([id, label]) => {
        const on = s.src === id;
        return { label, aria: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', pick: () => this.setState({ src: id }) };
      }),
      items: cur.items.map(([label, title, child], i) => {
        const done = i <= ui;
        return {
          label, title,
          indent: child ? '30px' : '10px', fw: child ? 400 : 600,
          bg: done ? '#E9E4FB' : 'transparent',
          dot: done ? '#4B3B8F' : '#FFFFFF', ring: done ? '#4B3B8F' : '#C9C3DE', tick: done ? '#FFFFFF' : 'transparent',
          prev: label === cur.prev && label !== up, here: label === up, aria: label === up ? 'true' : 'false',
          pick: () => this.setState({ upto: { ...s.upto, [s.src]: label } })
        };
      }),
      saveLabel: 'Snimi · do ' + up
    };
  }
}
</script>
</body>
</html>
