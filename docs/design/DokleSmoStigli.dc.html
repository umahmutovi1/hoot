<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Dokle ste stigli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C4892}a:hover{color:#36336E}
textarea::placeholder{color:#6E6A80}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: radial-gradient(120% 55% at 0% 0%, rgba(150,141,222,0.62), rgba(150,141,222,0) 62%), radial-gradient(90% 45% at 100% 22%, rgba(229,182,206,0.62), rgba(229,182,206,0) 62%), radial-gradient(110% 50% at 0% 68%, rgba(168,196,234,0.60), rgba(168,196,234,0) 62%), radial-gradient(95% 45% at 100% 100%, rgba(160,148,226,0.55), rgba(160,148,226,0) 62%), linear-gradient(180deg, #ECE9F4 0%, #E8E5F1 100%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; color: #14121C; position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 44px; width: 44px; border-radius: 22px; background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07)"></div>
<div style="height: 130px; border-radius: 32px; background: rgba(182,106,140,0.16)"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(40,34,80,0.20); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px)"></div>

<div role="dialog" aria-label="Dokle ste stigli" style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(250,249,253,0.80); backdrop-filter: blur(36px) saturate(180%); -webkit-backdrop-filter: blur(36px) saturate(180%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 -10px 40px rgba(40,34,80,0.12); border-radius: 32px 32px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 5px; border-radius: 3px; background: rgba(58,51,96,0.16); align-self: center"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Dokle ste stigli?</h1>
<p style="margin: 0; font-size: 14px; color: #3F3B4E">Signali i sistemi · predavanje · danas 09:00–11:00</p>
</div>

<div role="tablist" style="display: flex; background: rgba(106,100,184,0.10); border-radius: 22px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button role="tab" aria-selected="{{t.aria}}" onClick="{{t.pick}}" style="flex: 1; height: 40px; border-radius: 18px; border: none; background: {{t.bg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #14121C">{{t.label}}</button>
</sc-for>
</div>

<span style="font-size: 12px; color: #3F3B4E">Tapni zadnje poglavlje koje je obrađeno.</span>
<div role="radiogroup" aria-label="Obrađeno do" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="10">
<button role="radio" aria-checked="{{i.aria}}" onClick="{{i.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px 6px {{i.indent}}; border: none; border-radius: 14px; background: {{i.bg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; text-align: left; color: #14121C">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{i.ring}}; background: {{i.dot}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{i.tick}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="width: 30px; font-size: 13px; font-weight: 600; color: #3F3B4E; flex-shrink: 0">{{i.label}}</span>
<span style="flex: 1; font-size: 14px; font-weight: {{i.fw}}; min-width: 0">{{i.title}}</span>
<sc-if value="{{i.prev}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: rgba(195,141,82,0.18); color: #6B4A2A; white-space: nowrap">prošli put</span></sc-if>
<sc-if value="{{i.here}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: linear-gradient(160deg, #6E67BE, #4C4892); color: #FFFFFF; box-shadow: inset 0 1px 1px rgba(255,255,255,0.40), 0 6px 16px rgba(76,72,146,0.22); white-space: nowrap">do ovdje</span></sc-if>
</button>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Bilješka <span style="font-weight: 400; color: #3F3B4E">(opcionalno)</span></span>
<textarea rows="2" placeholder="npr. profesor preskočio 5.3, rade se zadaci" style="border: none; border-radius: 16px; padding: 12px 14px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; font-size: 15px; background: rgba(255,255,255,0.40); color: #14121C; resize: none"></textarea>
</label>

<a href="Predmet.dc.html" style="height: 56px; border-radius: 28px; background: linear-gradient(160deg, #6E67BE, #4C4892); color: #FFFFFF; box-shadow: inset 0 1px 1px rgba(255,255,255,0.40), 0 6px 16px rgba(76,72,146,0.22); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{saveLabel}}</a>
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Danas.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Nastava otkazana</a>
<a href="Danas.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none; color: #3F3B4E">Preskoči</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { src: 'book', upto: { book: '5.2', script: 'L8.2' } }; }
  renderVals() {
    const L = {
      book: { prev: '5', items: [['4', 'Fourierova transformacija', 0], ['4.1', 'Definicija i primjeri', 1], ['4.2', 'Svojstva FT', 1], ['4.3', 'Konvolucija i množenje', 1], ['5', 'DTFT', 0], ['5.1', 'Definicija DTFT', 1], ['5.2', 'Svojstva DTFT', 1], ['5.3', 'Diskretni LTI u frekvenciji', 1], ['6', 'Amplituda i faza', 0], ['6.1', 'Bodeov dijagram', 1]] },
      script: { prev: 'L8', items: [['L7', 'Diskretni signali', 0], ['L7.1', 'Odabiranje i aliasing', 1], ['L8', 'DTFT', 0], ['L8.1', 'Svojstva', 1], ['L8.2', 'Zadaci sa vježbi', 1], ['L9', 'Z-transformacija', 0], ['L9.1', 'Područje konvergencije', 1], ['L10', 'Sistemi u z-domenu', 0]] }
    };
    const s = this.state, cur = L[s.src], up = s.upto[s.src];
    const ui = cur.items.findIndex((x) => x[0] === up);
    return {
      tabs: [['book', 'Oppenheim'], ['script', 'Skripta']].map(([id, label]) => {
        const on = s.src === id;
        return { label, aria: on ? 'true' : 'false', bg: on ? 'rgba(255,255,255,0.55)' : 'transparent', pick: () => this.setState({ src: id }) };
      }),
      items: cur.items.map(([label, title, child], i) => {
        const done = i <= ui;
        return {
          label, title,
          indent: child ? '30px' : '10px', fw: child ? 400 : 600,
          bg: done ? 'rgba(106,100,184,0.16)' : 'transparent',
          dot: done ? '#4C4892' : '#FFFFFF', ring: done ? '#4C4892' : '#AFAAC4', tick: done ? '#FFFFFF' : 'transparent',
          prev: label === cur.prev && label !== up, here: label === up, aria: label === up ? 'true' : 'false',
          pick: () => this.setState({ upto: { ...s.upto, [s.src]: label } })
        };
      }),
      saveLabel: 'Snimi · do ' + up
    };
  }
}
</script>
</body>
</html>
