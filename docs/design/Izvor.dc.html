<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Izvor — Oppenheim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C4892}a:hover{color:#36336E}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: radial-gradient(120% 55% at 0% 0%, rgba(150,141,222,0.62), rgba(150,141,222,0) 62%), radial-gradient(90% 45% at 100% 22%, rgba(229,182,206,0.62), rgba(229,182,206,0) 62%), radial-gradient(110% 50% at 0% 68%, rgba(168,196,234,0.60), rgba(168,196,234,0) 62%), radial-gradient(95% 45% at 100% 100%, rgba(160,148,226,0.55), rgba(160,148,226,0) 62%), linear-gradient(180deg, #ECE9F4 0%, #E8E5F1 100%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; color: #14121C; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Predmet.dc.html" aria-label="Nazad" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14121C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<a href="Parsiranje.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07); text-decoration: none; display: flex; align-items: center; font-size: 14px; font-weight: 600">Uredi sadržaj</a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5853A0">Signali i sistemi · Knjiga</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.15">Oppenheim — Signals &amp; Systems</h1>
</div>

<div style="background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 3px; height: 14px"><span style="flex: 22; border-radius: 4px; background: #4C4892"></span><span style="flex: 18; border-radius: 4px; background: #6A64B8"></span><span style="flex: 18; border-radius: 4px; background: #BDB8E0"></span><span style="flex: 42; border-radius: 4px; background: rgba(58,51,96,0.10)"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">58%</span><span style="font-size: 11px; color: #3F3B4E">pređeno</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">~9h 40</span><span style="font-size: 11px; color: #3F3B4E">preostalo</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">3,4</span><span style="font-size: 11px; color: #3F3B4E">tvoje min/str.</span></div>
</div>
</div>

<div style="display: flex; gap: 8px" role="group" aria-label="Filter po ispitu">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: {{f.bg}}; color: {{f.fg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600">{{f.label}}</button>
</sc-for>
</div>

<div style="background: rgba(255,255,255,0.36); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.55), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(58,51,96,0.05), 0 8px 28px rgba(58,51,96,0.07); border-radius: 24px; padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{units}}" as="u" hint-placeholder-count="8">
<a href="Jedinica.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; padding-left: {{u.indent}}; text-decoration: none; color: #14121C; border-bottom: 1px solid rgba(106,100,184,0.10)">
<span style="width: 30px; font-size: 13px; font-weight: 600; color: #3F3B4E">{{u.label}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14px; font-weight: {{u.fw}}">{{u.title}}</span><span style="font-size: 11px; color: #55516A">{{u.meta}}</span></span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{u.bg}}; color: {{u.fg}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{u.status}}</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'p1' }; }
  renderVals() {
    const st = {
      0: ['Nije počето', 'rgba(106,100,184,0.10)', '#3F3B4E'], 1: ['Pročitano', 'rgba(106,100,184,0.16)', '#3F3B7E'],
      2: ['Razumijem', '#6A64B8', '#FFFFFF'], 3: ['Ponovljeno', '#4C4892', '#FFFFFF']
    };
    const all = [
      ['1', 'Signali i sistemi — uvod', 'str. 1–56 · težina 2', 3, 'p1', 0],
      ['2', 'LTI sistemi', 'str. 74–138 · težina 3', 3, 'p1', 0],
      ['3', 'Fourierov red', 'str. 177–250 · težina 4', 2, 'p1', 0],
      ['3.1', 'Odziv LTI na eksponencijale', 'str. 182–186', 2, 'p1', 1],
      ['3.2', 'Svojstva Fourierovog reda', 'str. 202–220 · ponavljanje 24. okt', 1, 'p1', 1],
      ['4', 'Fourierova transformacija', 'str. 284–355 · težina 5', 1, 'p1', 0],
      ['5', 'DTFT', 'str. 358–417 · težina 4', 0, 'p1', 0],
      ['6', 'Amplitudna i fazna karakteristika', 'str. 423–500', 0, 'p2', 0],
      ['7', 'Odabiranje', 'str. 514–568', 0, 'p2', 0],
      ['9', 'Laplaceova transformacija', 'str. 654–730 · težina 5', 0, 'p2', 0]
    ];
    const fl = [['all', 'Sve'], ['p1', 'I parcijala'], ['p2', 'II parcijala']];
    return {
      filters: fl.map(([id, label]) => {
        const on = this.state.f === id;
        return { label, bg: on ? '#14121C' : 'rgba(255,255,255,0.55)', fg: on ? '#FFFFFF' : '#14121C', pick: () => this.setState({ f: id }) };
      }),
      units: all.filter((u) => this.state.f === 'all' || u[4] === this.state.f).map(([label, title, meta, lvl, , child]) => ({
        label, title, meta, status: st[lvl][0], bg: st[lvl][1], fg: st[lvl][2],
        indent: child ? '30px' : '10px', fw: child ? 400 : 600
      }))
    };
  }
}
</script>
</body>
</html>
