<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Izvor — Oppenheim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B3B8F}a:hover{color:#2F2363}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F1EFF7; font-family: Outfit, sans-serif; color: #1D1A2B; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Predmet.dc.html" aria-label="Nazad" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<a href="Parsiranje.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-size: 14px; font-weight: 600">Uredi sadržaj</a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B4FA0">Signali i sistemi · Knjiga</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.15">Oppenheim — Signals &amp; Systems</h1>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 3px; height: 14px"><span style="flex: 22; border-radius: 4px; background: #4B3B8F"></span><span style="flex: 18; border-radius: 4px; background: #7C6BD6"></span><span style="flex: 18; border-radius: 4px; background: #C3B9F0"></span><span style="flex: 42; border-radius: 4px; background: #EEEBF5"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">58%</span><span style="font-size: 11px; color: #5B5670">pređeno</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">~9h 40</span><span style="font-size: 11px; color: #5B5670">preostalo</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">3,4</span><span style="font-size: 11px; color: #5B5670">tvoje min/str.</span></div>
</div>
</div>

<div style="display: flex; gap: 8px" role="group" aria-label="Filter po ispitu">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: {{f.bg}}; color: {{f.fg}}; font-family: Outfit, sans-serif; font-size: 13px; font-weight: 600">{{f.label}}</button>
</sc-for>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{units}}" as="u" hint-placeholder-count="8">
<a href="Jedinica.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; padding-left: {{u.indent}}; text-decoration: none; color: #1D1A2B; border-bottom: 1px solid #F1EFF7">
<span style="width: 30px; font-size: 13px; font-weight: 600; color: #5B5670">{{u.label}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14px; font-weight: {{u.fw}}">{{u.title}}</span><span style="font-size: 11px; color: #6E6985">{{u.meta}}</span></span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{u.bg}}; color: {{u.fg}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{u.status}}</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'p1' }; }
  renderVals() {
    const st = {
      0: ['Nije počето', '#F1EFF7', '#5B5670'], 1: ['Pročitano', '#E4DEFA', '#3B2D82'],
      2: ['Razumijem', '#7C6BD6', '#FFFFFF'], 3: ['Ponovljeno', '#4B3B8F', '#FFFFFF']
    };
    const all = [
      ['1', 'Signali i sistemi — uvod', 'str. 1–56 · težina 2', 3, 'p1', 0],
      ['2', 'LTI sistemi', 'str. 74–138 · težina 3', 3, 'p1', 0],
      ['3', 'Fourierov red', 'str. 177–250 · težina 4', 2, 'p1', 0],
      ['3.1', 'Odziv LTI na eksponencijale', 'str. 182–186', 2, 'p1', 1],
      ['3.2', 'Svojstva Fourierovog reda', 'str. 202–220 · ponavljanje 24. okt', 1, 'p1', 1],
      ['4', 'Fourierova transformacija', 'str. 284–355 · težina 5', 1, 'p1', 0],
      ['5', 'DTFT', 'str. 358–417 · težina 4', 0, 'p1', 0],
      ['6', 'Amplitudna i fazna karakteristika', 'str. 423–500', 0, 'p2', 0],
      ['7', 'Odabiranje', 'str. 514–568', 0, 'p2', 0],
      ['9', 'Laplaceova transformacija', 'str. 654–730 · težina 5', 0, 'p2', 0]
    ];
    const fl = [['all', 'Sve'], ['p1', 'I parcijala'], ['p2', 'II parcijala']];
    return {
      filters: fl.map(([id, label]) => {
        const on = this.state.f === id;
        return { label, bg: on ? '#1D1A2B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D1A2B', pick: () => this.setState({ f: id }) };
      }),
      units: all.filter((u) => this.state.f === 'all' || u[4] === this.state.f).map(([label, title, meta, lvl, , child]) => ({
        label, title, meta, status: st[lvl][0], bg: st[lvl][1], fg: st[lvl][2],
        indent: child ? '30px' : '10px', fw: child ? 400 : 600
      }))
    };
  }
}
</script>
</body>
</html>
