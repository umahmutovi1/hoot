<button style="display: flex; align-items: center; gap: 12px; padding: 12px 0;  border: none; border-bottom: none; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Geist, system-ui, sans-serif; color: #14121C; text-align: left; width: 100%"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Integralni</span><span style="font-size: 12px; color: #55516A">jan-feb rok · zamjenjuje parcijale</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #55516A">–<span style="font-weight: 400; color: #55516A"> / 80</span></span><span style="font-size: 11px; color: #55516A">samo ako zatreba</span></span></button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { target: 9 }; }
  renderVals() {
    const t = this.state.target;
    const G = [[6, 'Treba 23 od 60', 'bar 20 na II parcijali (prag)', 'skoro sigurno', '#365C45'], [7, 'Treba 33 od 60', 'prosjek 55% na preostalom', '', '#3F3B4E'], [8, 'Treba 43 od 60', 'prosjek 72%', '', '#3F3B4E'], [9, 'Treba 53 od 60', 'prosjek 88%', 'željena', '#4C4892'], [10, 'Treba 63, ostalo je 60', 'najviše moguće je 92', 'nedostižno', '#B0413E']];
    return { grades: G.map(([n, need, sub, tag, tc]) => { const on = n === t; return { n, need, sub, tag: on ? 'željena' : tag, tc: on ? '#4C4892' : tc, bg: on ? 'rgba(255,255,255,0.6)' : 'transparent', cbg: on ? '#4C4892' : 'rgba(106,100,184,0.10)', cfg: on ? '#FFFFFF' : '#14121C' }; }) };
  }
}
